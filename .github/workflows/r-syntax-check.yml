name: R syntax check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  parse-r-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R scripts
        shell: Rscript {0}
        run: |
          scripts <- list.files("analysis", pattern = "[.]R$", full.names = TRUE)
          for (script in scripts) {
            parse(file = script)
            message("Parsed: ", script)
          }
